<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAW2DAW</title>
  <meta name="description" content="A translator for music production software. Pick the DAW you know and the DAW you are learning, then search for a feature or shortcut.">
  <meta name="theme-color" content="#3B1538">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DAW2DAW">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>DAW<span class="two">2</span>DAW</h1>
      <p class="tagline">Find the feature you already know, under its new name.</p>
    </div>
    <svg class="notes" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path class="beam" d="M18 10 L44 4 L44 10 L18 16 Z"/>
      <path class="stem" d="M18 13 V38 M44 7 V32"/>
      <ellipse class="head" cx="12.5" cy="39" rx="7" ry="5.2" transform="rotate(-20 12.5 39)"/>
      <ellipse class="head" cx="38.5" cy="33" rx="7" ry="5.2" transform="rotate(-20 38.5 33)"/>
    </svg>
  </header>

  <main>
    <section class="picker" aria-label="Choose your DAWs">
      <div class="pick">
        <label for="fromDaw">I know</label>
        <select id="fromDaw"></select>
      </div>
      <button id="swap" type="button" aria-label="Swap the two DAWs" title="Swap">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-4-4"/><path d="M17 17H5l4 4"/></svg>
      </button>
      <div class="pick">
        <label for="toDaw">I'm learning</label>
        <select id="toDaw"></select>
      </div>
    </section>

    <section class="search" aria-label="Search">
      <label for="q" class="sr-only">Search for a term, feature, or shortcut</label>
      <div class="searchbox">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search: bounce, split, cmd+t ..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <span id="meter" class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </section>

    <div class="statusline">
      <span id="eq" class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
    <div id="results"></div>
  </main>

  <footer>
    <p>Shortcuts are the defaults and can differ by version or if you have customized them.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
